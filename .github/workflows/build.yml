name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-24.04

    env:
      isAlpha: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run build.sh
        run: sh build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Surfing-${{ github.run_number }}
          path: Surfing_*.zip
          if-no-files-found: error
