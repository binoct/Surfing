<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surfing 控制台</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b21;
    --line: #262b33;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --on: #34c759;
    --off: #8e8e93;
    --danger: #ff453a;
    --accent: #4f8cff;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f2f3f5; --card: #ffffff; --line: #e3e5e8; --text: #1b1c1e; --muted: #6b7075; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 20px 16px 32px;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .dash { text-decoration: none; color: var(--accent); font-size: 13px; white-space: nowrap; padding-bottom: 2px; }
  .dash.disabled { color: var(--muted); pointer-events: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .status { display: flex; flex-direction: column; gap: 6px; }
  .state { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; flex: none;
    background: var(--off); box-shadow: 0 0 0 4px rgba(142,142,147,.15);
  }
  .dot.on { background: var(--on); box-shadow: 0 0 0 4px rgba(52,199,89,.15); }
  .dot.warn { background: #ff9f0a; box-shadow: 0 0 0 4px rgba(255,159,10,.15); }
  .sub-state {
    font-size: 15px; font-weight: 500;
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
  }
  .meta { color: var(--muted); font-size: 13px; min-height: 20px; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  button {
    appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    height: 46px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:active { transform: scale(.985); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #btnStart { border-color: rgba(52,199,89,.4); color: var(--on); }
  #btnStop { border-color: rgba(255,69,58,.4); color: var(--danger); }
  #btnUpdate { grid-column: 1 / -1; border-color: rgba(79,140,255,.4); color: var(--accent); }
  .log { padding: 0; overflow: hidden; }
  .log-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    color: var(--muted); font-size: 12px;
  }
  .log-tools { display: flex; gap: 8px; }
  .mini {
    height: 26px; padding: 0 10px; font-size: 12px; font-weight: 400;
    border-radius: 8px; color: var(--muted); background: transparent;
  }
  pre {
    margin: 0; padding: 12px 14px; max-height: 44vh; overflow: auto;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-all; color: var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Surfing</h1>
      <div class="sub">Clash 运行控制</div>
    </div>
    <a id="dash" class="dash disabled" href="http://127.0.0.1:9090/ui" target="_blank" rel="noopener">打开控制台 ↗</a>
  </header>

  <section class="card status">
    <div class="state"><span id="dot" class="dot"></span><span id="state">检测中…</span></div>
    <div class="meta" id="meta"></div>
    <div class="state sub-state"><span id="edot" class="dot"></span><span id="estate">外部引擎检测中…</span></div>
    <div class="meta" id="emeta"></div>
  </section>

  <section class="actions">
    <button id="btnStart" disabled>启动</button>
    <button id="btnRestart" disabled>重启</button>
    <button id="btnStop" disabled>关闭</button>
    <button id="btnUpdate" disabled>更新引擎</button>
  </section>

  <section class="card log">
    <div class="log-head"><span>输出</span><div class="log-tools"><button id="btnLog" class="mini">引擎日志</button><button id="btnClear" class="mini">清空</button></div></div>
    <pre id="out">就绪</pre>
  </section>
</div>
<script>
(function () {
  'use strict';

  var SCRIPTS = '/data/adb/box_bll/scripts';

  var PRE = [
    'export PATH=/data/adb/box_bll/bin:$PATH',
    'n=$(sed -n \'s/^bin_name="\\(.*\\)"/\\1/p\' ' + SCRIPTS + '/box.config 2>/dev/null | head -n1)',
    '[ -n "$n" ] || n=clash'
  ].join('\n');

  var CMD_STATUS = PRE + '\n' + SCRIPTS + '/box.service probe';

  var CMD_START = PRE + '\n' + [
    'if pidof -s "$n" >/dev/null 2>&1; then echo "已在运行，无需重复启动"; exit 0; fi',
    SCRIPTS + '/box.service start || exit $?',
    SCRIPTS + '/box.iptables enable',
    'sleep 4',
    SCRIPTS + '/box.service extra-log 40'
  ].join('\n');

  var CMD_LOG = PRE + '\n' + SCRIPTS + '/box.service extra-log 40';

  var CMD_RESTART = PRE + '\n' + SCRIPTS + '/box.service restart';

  var CMD_STOP = PRE + '\n' + [
    SCRIPTS + '/box.service stop',
    SCRIPTS + '/box.iptables disable'
  ].join('\n');

  var CMD_UPDATE = PRE + '\n' + SCRIPTS + '/box.service extra-update';

  var els = {
    dot: document.getElementById('dot'),
    state: document.getElementById('state'),
    meta: document.getElementById('meta'),
    edot: document.getElementById('edot'),
    estate: document.getElementById('estate'),
    emeta: document.getElementById('emeta'),
    out: document.getElementById('out'),
    dash: document.getElementById('dash'),
    start: document.getElementById('btnStart'),
    restart: document.getElementById('btnRestart'),
    stop: document.getElementById('btnStop'),
    update: document.getElementById('btnUpdate'),
    logBtn: document.getElementById('btnLog'),
    clear: document.getElementById('btnClear')
  };

  var ENGINE_NAMES = { aether: 'Aether', usque: 'usque', warpscout: 'warpscout' };

  var busy = false;
  var refreshing = false;
  var running = false;
  var failCount = 0;

  function runShell(cmd) {
    return new Promise(function (resolve, reject) {
      var api = window.ksu || window.apatch;
      if (api && typeof api.exec === 'function') {
        var ret;
        try {
          ret = api.exec(cmd);
        } catch (e) {
          reject(e);
          return;
        }
        if (ret && typeof ret.then === 'function') {
          ret.then(function (v) {
            if (typeof v === 'string') {
              resolve({ code: 0, out: v, err: '' });
              return;
            }
            v = v || {};
            resolve({
              code: typeof v.errno === 'number' ? v.errno : (typeof v.code === 'number' ? v.code : 0),
              out: v.stdout || '',
              err: v.stderr || ''
            });
          }, reject);
          return;
        }
        resolve({ code: 0, out: typeof ret === 'string' ? ret : '', err: '' });
        return;
      }
      if (typeof window.exec === 'function') {
        window.exec(cmd, function (errno, stdout, stderr) {
          resolve({ code: errno || 0, out: stdout || '', err: stderr || '' });
        });
        return;
      }
      reject(new Error('当前管理器不支持执行命令（需要 KernelSU / APatch 的 WebUI）'));
    });
  }

  function withTimeout(promise, ms) {
    return new Promise(function (resolve, reject) {
      var timer = setTimeout(function () {
        reject(new Error('执行超时（' + Math.round(ms / 1000) + ' 秒），命令可能仍在后台运行'));
      }, ms);
      promise.then(function (v) {
        clearTimeout(timer);
        resolve(v);
      }, function (e) {
        clearTimeout(timer);
        reject(e);
      });
    });
  }

  function log(msg) {
    var prev = els.out.textContent;
    var text = prev === '就绪' ? msg : prev + '\n\n' + msg;
    els.out.textContent = text.slice(-12000);
    els.out.scrollTop = els.out.scrollHeight;
  }

  function parseStatus(text) {
    var data = {};
    (text || '').split(/\r?\n/).forEach(function (line) {
      var i = line.indexOf('=');
      if (i > 0) {
        data[line.slice(0, i).trim()] = line.slice(i + 1).trim();
      }
    });
    return data;
  }

  function fmtUptime(t) {
    if (!t) return '';
    var days = 0;
    var rest = t;
    var dash = t.split('-');
    if (dash.length === 2) {
      days = parseInt(dash[0], 10) || 0;
      rest = dash[1];
    }
    var parts = rest.split(':').map(function (x) { return parseInt(x, 10) || 0; });
    var h = 0, m = 0, s = 0;
    if (parts.length === 3) {
      h = parts[0]; m = parts[1]; s = parts[2];
    } else if (parts.length === 2) {
      m = parts[0]; s = parts[1];
    }
    var out = [];
    if (days) out.push(days + ' 天');
    if (h) out.push(h + ' 小时');
    if (m && !days) out.push(m + ' 分');
    if (!days && !h && !m) out.push(s + ' 秒');
    return out.join(' ');
  }

  function setButtons() {
    els.start.disabled = busy || running;
    els.restart.disabled = busy || !running;
    els.stop.disabled = busy || !running;
    els.update.disabled = busy;
    els.dash.className = 'dash' + (running ? '' : ' disabled');
  }

  function render(data) {
    running = data.clash_state === 'running';
    els.dot.className = 'dot' + (running ? ' on' : '');
    els.state.textContent = running ? '运行中' : '已停止';
    if (running) {
      var bits = [];
      if (data.clash_pid) bits.push('PID ' + data.clash_pid);
      var up = fmtUptime(data.clash_etime);
      if (up) bits.push('已运行 ' + up);
      els.meta.textContent = bits.join(' · ');
    } else {
      els.meta.textContent = '点击「启动」运行 clash';
    }
    renderEngine(data);
    setButtons();
  }

  function renderEngine(data) {
    var state = data.engine_state || 'unknown';
    var name = ENGINE_NAMES[data.engine] || data.engine || '';
    var dot = 'dot';
    var text;
    var bits = [];
    if (state === 'disabled') {
      text = '外部引擎：未启用';
      bits.push('在 extra/engine 的 engine= 行填写 aether / usque / warpscout 可启用');
    } else if (state === 'running') {
      dot = 'dot on';
      text = name + ' 运行中';
      if (data.engine_pid) bits.push('PID ' + data.engine_pid);
      var up = fmtUptime(data.engine_etime);
      if (up) bits.push('已运行 ' + up);
      if (data.engine_version) bits.push(data.engine_version);
    } else if (state === 'initializing') {
      dot = 'dot warn';
      text = name + ' 正在初始化…';
      if (data.engine_pid) bits.push('PID ' + data.engine_pid);
    } else if (state === 'missing') {
      dot = 'dot warn';
      text = name + ' 未安装';
      bits.push('点击「更新引擎」下载');
    } else if (state === 'stopped') {
      text = name + ' 已停止';
      if (data.engine_version) bits.push(data.engine_version);
    } else {
      text = '外部引擎：状态未知';
    }
    els.edot.className = dot;
    els.estate.textContent = text;
    els.emeta.textContent = bits.join(' · ');
  }

  function refresh() {
    if (busy || refreshing) return;
    refreshing = true;
    withTimeout(runShell(CMD_STATUS), 15000).then(function (r) {
      failCount = 0;
      render(parseStatus(r.out));
    }, function (e) {
      running = false;
      els.dot.className = 'dot';
      els.state.textContent = '状态未知';
      els.meta.textContent = (e && e.message) ? e.message : String(e);
      els.edot.className = 'dot';
      els.estate.textContent = '外部引擎：状态未知';
      els.emeta.textContent = '';
      els.start.disabled = true;
      els.restart.disabled = true;
      els.stop.disabled = true;
      els.update.disabled = true;
      els.dash.className = 'dash disabled';
      // 管理器接口注入较慢时快速重试, 其余情况交给定时轮询
      if (failCount < 5) {
        failCount += 1;
        setTimeout(refresh, 1500);
      }
    }).then(function () {
      refreshing = false;
    });
  }

  // 切回前台 / 重新获得焦点时立即刷新, 并清掉后台冻结时可能挂起的请求标志
  function refreshNow() {
    refreshing = false;
    refresh();
  }

  function action(label, cmd, confirmText, timeoutMs) {
    if (busy) return;
    if (confirmText && !window.confirm(confirmText)) return;
    busy = true;
    setButtons();
    els.state.textContent = '执行中…';
    els.meta.textContent = label;
    log('$ ' + label + ' ...');

    withTimeout(runShell(cmd), timeoutMs || 180000).then(function (r) {
      var text = r.out || '';
      if (r.err) text += (text ? '\n' : '') + '[stderr]\n' + r.err;
      log('$ ' + label + (text ? '\n' + text : '') + '\n[退出码 ' + r.code + ']');
    }, function (e) {
      log('$ ' + label + '\n[失败] ' + ((e && e.message) ? e.message : e));
    }).then(function () {
      busy = false;
      setTimeout(refresh, 300);
    });
  }

  els.start.addEventListener('click', function () {
    action('启动', CMD_START);
  });
  els.restart.addEventListener('click', function () {
    action('重启', CMD_RESTART, '确认重启 clash？期间透明代理会短暂中断。');
  });
  els.stop.addEventListener('click', function () {
    action('关闭', CMD_STOP, '确认关闭 clash 并卸载透明代理规则？');
  });
  els.update.addEventListener('click', function () {
    action('更新引擎', CMD_UPDATE, '确认下载/更新外部引擎？更新期间该引擎的代理会短暂中断。', 600000);
  });
  els.logBtn.addEventListener('click', function () {
    action('引擎日志', CMD_LOG, '', 30000);
  });
  els.clear.addEventListener('click', function () {
    els.out.textContent = '就绪';
  });

  refresh();
  setInterval(refresh, 5000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'hidden') refreshNow();
  });
  window.addEventListener('focus', refreshNow);
  window.addEventListener('pageshow', refreshNow);
})();
</script>
</body>
</html>
